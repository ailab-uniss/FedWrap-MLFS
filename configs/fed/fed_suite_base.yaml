seed: 0
method: fed_fedwrap
dataset:
  kind: prefold
  root: data/dense_benchmark_v3
  name: PLACEHOLDER
  split:
    val_size: 0.25
cross_validation:
  enabled: true
  n_folds: 5
model:
  kind: mlknn
  k: 10
  s: 1.0
  mlknn_backend: gpu
  mlknn_device: cuda
objectives:
  names:
  - one_minus_macro_f1
  - one_minus_micro_f1
  - feature_ratio
  hv_ref:
    0: 1.0
    1: 1.0
    2: 1.0
evolution:
  max_evals_per_feature: 1.0
  crossover_prob: 0.9
  mutation_prob: 0.2
  pop_size: 30
  genotype: hypergraph
  early_stopping:
    enabled: true
    window: 5
    rel_tol: 0.005
    patience: 3
cc:
  enabled: true
  pop_size_subcomp: 16
  outer_iters: 100
  inner_gens: 2
  rho_star: 0.1
  schedule: weighted
  bites:
    enabled: true
    role: prescreen_only
    promote_topk_per_block: 4
  fed_scheduling:
    enabled: true
  bridge:
    enabled: true
    threshold: 0.6
  pop_size_sub: 20
hypergraph:
  construction: multilayer_label
  target_feature_ratio: 0.25
  init_edge_prob: 0.3
  edge_prune_prob: 0.1
  injection_prob: 0.3
  min_feature_ratio: 0.03
  feature_cluster_edges: auto
  fl_topm_ratio: 0.15
  fl_topm_min: 3
  fl_topm_max: auto
  fl_topm_rel_alpha: auto
  fl_topk_labels_per_feature: 8
federated:
  enabled: true
  n_clients: 10
  partition: label_skew_dirichlet
  dirichlet_alpha: 0.3
  min_samples_per_client: 32
  client_fraction_bite: 0.3
  client_fraction_full: 1.0
  final_eval_all_clients: true
  return_client_metrics: true
  estimate_communication: true
  n_jobs: 1
logging:
  out_dir: runs/fed/suite_run
reporting:
  budget_mode: count
  budget_step: 1
  max_feature_ratio: 0.25
